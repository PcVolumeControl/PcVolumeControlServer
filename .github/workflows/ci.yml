name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release runs the same checks before building.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Installs the toolchain and components named in rust-toolchain.toml.
      - run: rustup toolchain install --no-self-update

      - run: cargo fmt --all --check

  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2

      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # View tests render with tiny-skia (.cargo/config.toml), so no display
      # is needed.
      - name: Test
        run: cargo test --workspace --locked

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install the app's rust-version toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' crates/pcvc-app/Cargo.toml)
          test -n "$msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          # Overrides rust-toolchain.toml for the rest of the job.
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - uses: ./.github/actions/linux-deps

      - name: Check
        run: cargo check -p pcvolumecontrol --all-targets --locked
