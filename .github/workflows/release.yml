name: Release

# Pushing a tag such as v1.2.3 builds the artifacts and publishes a GitHub
# release for it. A manual run builds the same artifacts for the given
# version and stops before publishing.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without publishing, for example 1.2.3-test
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Release builds start from a clean target directory (no rust-cache) so a
# poisoned or stale cache cannot reach published binaries.
jobs:
  # After the version job, so a malformed tag fails before any check runs.
  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Take the version from the tag
        id: version
        env:
          REQUESTED: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
        run: |
          version="${REQUESTED#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::'$REQUESTED' is not a version like v1.2.3 or v1.2.3-rc.1"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: [ci, version]
    # The oldest supported runner sets the glibc floor for the binary.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: rustup toolchain install --no-self-update --profile minimal

      - uses: ./.github/actions/stamp-version
        with:
          version: ${{ needs.version.outputs.version }}

      - uses: ./.github/actions/linux-deps

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.8.0 --locked

      - name: Build
        run: cargo build --release --locked -p pcvolumecontrol

      - name: Package .deb
        run: |
          mkdir -p dist
          # Named with the tag's version: cargo-deb's default name spells a
          # pre-release with "~", which GitHub rewrites in asset names.
          cargo deb -p pcvolumecontrol --no-build \
            --output "dist/pcvolumecontrol_$VERSION-1_amd64.deb"

      - name: Package tar.gz
        run: |
          name="pcvolumecontrol-$VERSION-linux-x86_64"
          mkdir -p "staging/$name"
          cp target/release/pcvolumecontrol \
            packaging/linux/pcvolumecontrol.desktop \
            packaging/linux/pcvolumecontrol.svg \
            LICENSE README.md "staging/$name/"
          tar -C staging -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    needs: [ci, version]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: rustup toolchain install --no-self-update --profile minimal

      - uses: ./.github/actions/stamp-version
        with:
          version: ${{ needs.version.outputs.version }}

      - name: Build
        run: cargo build --release --locked -p pcvolumecontrol

      - name: Build installer
        run: |
          # Newest Inno Setup installed; the script needs 6.3 or later.
          function Find-Iscc {
            Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
              Sort-Object { [version]$_.VersionInfo.FileVersion } -Descending |
              Select-Object -First 1
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Find-Iscc
          }
          if (-not $iscc) { throw "Inno Setup (ISCC.exe) not found" }
          & $iscc.FullName "/DAppVersion=$env:VERSION" "/DOutputDir=$env:GITHUB_WORKSPACE\dist" packaging\windows\pcvolumecontrol.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package zip
        run: |
          $name = "pcvolumecontrol-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Path "staging\$name" | Out-Null
          Copy-Item target\release\pcvolumecontrol.exe, README.md -Destination "staging\$name"
          Copy-Item LICENSE -Destination "staging\$name\LICENSE.txt"
          Compress-Archive -Path "staging\$name" -DestinationPath "dist\$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  publish:
    # A manual run stops here, with the artifacts attached to the run.
    if: github.event_name == 'push'
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      # For the public key the binaries were built with.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          path: source

      # Optional: signs SHA256SUMS when the MINISIGN_SECRET_KEY secret is set
      # (docs/RELEASING.md). Apps built with a public key refuse to install
      # an update without a valid signature, so a key without the secret
      # stops the release.
      - name: Sign checksums
        working-directory: dist
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          PUBLIC_KEY: ../source/crates/pcvc-app/assets/update-key.pub
        run: |
          has_public=false
          if grep -q '[^[:space:]]' "$PUBLIC_KEY"; then has_public=true; fi
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            if $has_public; then
              echo "::error::$PUBLIC_KEY has a key but the MINISIGN_SECRET_KEY secret is not set"
              exit 1
            fi
            echo "No signing key; publishing checksums without a signature"
            exit 0
          fi
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends minisign
          key="$RUNNER_TEMP/minisign.key"
          (umask 077 && printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key")
          minisign -S -s "$key" -m SHA256SUMS -x SHA256SUMS.minisig \
            -t "pcvolumecontrol $GITHUB_REF_NAME"
          rm -f "$key"
          if $has_public; then
            minisign -V -p "$PUBLIC_KEY" -m SHA256SUMS -x SHA256SUMS.minisig
          else
            echo "::warning::signed, but the app has no public key in $PUBLIC_KEY to check it with"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
