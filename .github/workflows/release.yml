name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Release builds start from a clean target directory (no rust-cache) so a
# poisoned or stale cache cannot reach published binaries.
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: rustup toolchain install --no-self-update --profile minimal

      - name: Check the tag matches the package version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r '.packages[] | select(.name == "pcvolumecontrol") | .version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # The oldest supported runner sets the glibc floor for the binary.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: rustup toolchain install --no-self-update --profile minimal

      - name: Install build dependencies
        run: |
          if grep -q libpulse crates/pcvc-audio/Cargo.toml; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libpulse-dev
          fi

      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.8.0 --locked

      - name: Build
        run: cargo build --release --locked -p pcvolumecontrol

      - name: Package .deb
        run: |
          mkdir -p dist
          cargo deb -p pcvolumecontrol --no-build --output dist/

      - name: Package tar.gz
        run: |
          name="pcvolumecontrol-$VERSION-linux-x86_64"
          mkdir -p "staging/$name"
          cp target/release/pcvolumecontrol \
            packaging/linux/pcvolumecontrol.desktop \
            packaging/linux/pcvolumecontrol.svg \
            LICENSE README.md "staging/$name/"
          tar -C staging -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/*
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: rustup toolchain install --no-self-update --profile minimal

      - name: Build
        run: cargo build --release --locked -p pcvolumecontrol

      - name: Build installer
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", "$env:ProgramFiles\Inno Setup *\ISCC.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Select-Object -First 1
          }
          & $iscc.FullName "/DAppVersion=$env:VERSION" "/DOutputDir=$env:GITHUB_WORKSPACE\dist" packaging\windows\pcvolumecontrol.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package zip
        run: |
          $name = "pcvolumecontrol-$env:VERSION-windows-x86_64"
          New-Item -ItemType Directory -Path "staging\$name" | Out-Null
          Copy-Item target\release\pcvolumecontrol.exe, README.md -Destination "staging\$name"
          Copy-Item LICENSE -Destination "staging\$name\LICENSE.txt"
          Compress-Archive -Path "staging\$name" -DestinationPath "dist\$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS

      # A draft, so the artifacts can be smoke tested before publishing.
      - uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
