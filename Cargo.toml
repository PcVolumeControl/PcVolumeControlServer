[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/PcVolumeControl/PcVolumeControlServer"

[workspace.dependencies]
pcvc-protocol = { path = "crates/pcvc-protocol" }
pcvc-audio = { path = "crates/pcvc-audio" }
pcvc-server = { path = "crates/pcvc-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1.54"
tokio-util = "0.7.20"
futures-util = { version = "0.3.34", default-features = false }
tracing = "0.1.44"
mdns-sd = "0.21.7"
hostname = "0.4.2"
tracing-subscriber = "0.3.23"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
