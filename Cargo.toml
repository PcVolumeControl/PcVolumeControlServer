[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/PcVolumeControl/PcVolumeControlServer"

[workspace.dependencies]
pcvc-protocol = { path = "crates/pcvc-protocol" }
pcvc-audio = { path = "crates/pcvc-audio" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = "1.54"
