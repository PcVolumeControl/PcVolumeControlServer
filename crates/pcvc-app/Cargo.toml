[package]
name = "pcvolumecontrol"
description = "Control this computer's volume from your phone"
version.workspace = true
edition.workspace = true
# tray-icon and muda need 1.90 (File::try_lock alone needs 1.89). CI checks
# this version.
rust-version = "1.90"
license.workspace = true
repository.workspace = true
keywords = ["volume", "mixer", "audio", "remote-control", "tray"]
categories = ["multimedia::audio", "gui"]

[lints]
workspace = true

[[bin]]
name = "pcvolumecontrol"
path = "src/main.rs"

[dependencies]
pcvc-protocol.workspace = true
pcvc-audio.workspace = true
pcvc-server.workspace = true
# Application icons are decoded by resvg/tiny-skia and handed to iced as
# RGBA, so iced's image widget needs no codecs.
iced = { version = "0.14", features = ["tokio", "svg", "image-without-codecs"] }
resvg = { version = "0.45", default-features = false }
tokio = { workspace = true, features = ["rt", "macros", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "chrono"] }
tracing-appender = "0.2.5"
chrono = { version = "0.4.26", default-features = false, features = ["clock", "std"] }
directories = "6"
serde.workspace = true
toml = "1"
auto-launch = "0.6"
interprocess = "2.4"
thiserror.workspace = true
if-addrs = "0.15"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Target tables on build dependencies match the host, so winresource is only
# built (and build.rs only embeds resources) on a Windows host.
[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1.34", default-features = false }

[dev-dependencies]
tempfile = "3"
iced_test = "0.14"
base64.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[package.metadata.deb]
maintainer = "PcVolumeControl <https://github.com/PcVolumeControl/PcVolumeControlServer/issues>"
copyright = "2017 Adam Brown"
license-file = ["../../LICENSE", "0"]
section = "sound"
priority = "optional"
extended-description = """\
PcVolumeControl lets the PcVolumeControl Android and iOS apps adjust this \
computer's volume over the local network: master volume, mute, the default \
output device and per-application volume. It lives in the system tray, \
advertises itself over mDNS so phones find it, and has a window with a local \
mixer, connection status and settings."""
# $auto finds linked libraries (libpulse0) but cannot see dlopened ones. winit loads libxkbcommon and the X11
# libraries (enough on Wayland sessions too, through XWayland) and prefers the
# Wayland ones when present; wgpu loads EGL and iced falls back to software
# rendering without it.
depends = "$auto, libxkbcommon0, libxkbcommon-x11-0, libx11-6, libx11-xcb1, libxcursor1, libxi6"
recommends = "libwayland-client0, libwayland-egl1, libegl1, libegl-mesa0"
assets = [
    ["target/release/pcvolumecontrol", "usr/bin/", "755"],
    ["../../packaging/linux/pcvolumecontrol.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/pcvolumecontrol.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["../../README.md", "usr/share/doc/pcvolumecontrol/", "644"],
]
