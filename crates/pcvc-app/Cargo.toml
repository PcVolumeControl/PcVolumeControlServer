[package]
name = "pcvolumecontrol"
description = "PcVolumeControl desktop host: tray icon, server and mixer GUI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "pcvolumecontrol"
path = "src/main.rs"

[dependencies]
pcvc-protocol.workspace = true
pcvc-audio.workspace = true
pcvc-server.workspace = true
iced = { version = "0.14", features = ["tokio", "svg"] }
resvg = { version = "0.45", default-features = false }
tokio = { workspace = true, features = ["rt", "macros", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
if-addrs = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

