[package]
name = "pcvolumecontrol"
description = "Control this computer's volume from your phone"
version.workspace = true
edition.workspace = true
# File::try_lock (single-instance lock) needs 1.89.
rust-version = "1.89"
license.workspace = true
repository.workspace = true
keywords = ["volume", "mixer", "audio", "remote-control", "tray"]
categories = ["multimedia::audio", "gui"]

[lints]
workspace = true

[[bin]]
name = "pcvolumecontrol"
path = "src/main.rs"

[dependencies]
pcvc-protocol.workspace = true
pcvc-audio.workspace = true
pcvc-server.workspace = true
iced = { version = "0.14", features = ["tokio", "svg"] }
resvg = { version = "0.45", default-features = false }
tokio = { workspace = true, features = ["rt", "macros", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "chrono"] }
tracing-appender = "0.2.5"
chrono = { version = "0.4.26", default-features = false, features = ["clock", "std"] }
directories = "6"
serde.workspace = true
toml = "1"
auto-launch = "0.6"
interprocess = "2.4"
thiserror.workspace = true
if-addrs = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile = "3"
iced_test = "0.14"

