[package]
name = "pcvc-server"
description = "PcVolumeControl TCP server, state broadcaster and mDNS advertiser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pcvc-protocol.workspace = true
pcvc-audio.workspace = true
futures-util.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
tracing.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "time"] }
