[package]
name = "pcvc-server"
description = "PcVolumeControl TCP server, state broadcaster and mDNS advertiser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
pcvc-protocol.workspace = true
pcvc-audio.workspace = true
futures-util.workspace = true
hostname.workspace = true
mdns-sd = { workspace = true, features = ["async"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true, features = ["codec", "rt"] }
tracing.workspace = true

[dev-dependencies]
base64.workspace = true
png.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-util", "net", "signal", "time"] }

[lints]
workspace = true
